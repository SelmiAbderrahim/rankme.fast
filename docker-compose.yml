  # Public web entrypoint — Node SSR server (server.js). Renders marketing
  # pages server-side for crawlers/AI, serves the CSR shell for the app, and
  # reverse-proxies /robots.txt + /sitemap*.xml to the api SEO module.
  web:
    init: true
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-dev}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_URL: ${APP_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_GA_ID: ${VITE_GA_ID:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_RELEASE_STAGE: ${VITE_RELEASE_STAGE:-beta}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    networks: [rankme]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WEB_PORT: 3000
      CLIENT_URL: ${CLIENT_URL}
      APP_URL: ${APP_URL:-}
      # Runtime CSP allow-list; the same values are also baked into the client.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
      # Internal origin of the api service for the SEO reverse-proxy.
      API_INTERNAL_URL: http://api:8080
      # Upstream fetch timeout for the AI Assistant SSE stream proxy route
      # (POST /api/chat/conversations/:id/messages). Web-container-only —
      # never read by server/src/config/env.ts. Default 5 minutes.
      PROXY_STREAM_TIMEOUT_MS: ${PROXY_STREAM_TIMEOUT_MS:-300000}
    ports:
      # Loopback-only — nginx is the sole public entrypoint. Host port off the
      # 3000 default to avoid colliding with other stacks on this box.
      - "127.0.0.1:${WEB_PORT:-43000}:3000"
    volumes:
      # Documentation source — read-only input for SSR, search, and explicit
      # text/markdown clients without rebaking the image for copy edits.
      - ./docs:/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
